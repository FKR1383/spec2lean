[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2lean"
version = "1.0.0"
description = "Evidence-grounded specification-to-Lean pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0,<7",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
spec2lean = "spec2lean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spec2lean.gui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
