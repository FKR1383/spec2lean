[workspace]
resolver = "3"
members = ["crates/harness", "crates/runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.dev]
debug = 0

[profile.release]
debug = 1
