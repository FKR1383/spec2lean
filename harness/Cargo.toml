[workspace]
resolver = "3"
members = [
    "crates/harness",
    "crates/lean",
    "crates/specdb",
    "crates/evidence",
    "crates/semantics",
    "crates/translation",
    "crates/s2l",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
harness = { path = "crates/harness" }
spec2lean-lean = { path = "crates/lean" }
spec2lean-specdb = { path = "crates/specdb" }
spec2lean-evidence = { path = "crates/evidence" }
spec2lean-semantics = { path = "crates/semantics" }
spec2lean-translation = { path = "crates/translation" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
unicode-normalization = "0.1"

[profile.release]
debug = 1

# The machine this is developed on runs its root filesystem near capacity, and
# full debug info costs several hundred megabytes of target/. Panic messages
# still carry file and line via #[track_caller]; only backtrace symbolisation
# is lost. Raise this locally if you need to attach a debugger.
[profile.dev]
debug = 0
